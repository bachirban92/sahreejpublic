<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sahreej Admin · Settlements</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f7;color:#111}.shell{max-width:980px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #e5e5e5;border-radius:20px;padding:18px;margin-bottom:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-size:28px;font-weight:900}.muted{color:#6d6d6d}.tiny{font-size:12px}.hidden{display:none!important}button,input{font:inherit}button{border:0;border-radius:13px;padding:11px 15px;font-weight:850;cursor:pointer}.primary{background:#111;color:#fff}.secondary{background:#eee}.danger{background:#fee;color:#900}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px}label{display:block;font-weight:750;font-size:13px;margin:10px 0 5px}.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}.metric{padding:13px;border-radius:15px;background:#f7f7f7}.metric small{display:block;color:#777}.metric strong{display:block;font-size:20px;margin-top:3px}.balance{font-size:26px;font-weight:950}.driver-card{border:1px solid #e7e7e7;border-radius:18px;padding:16px;margin:12px 0;background:#fff}.ledger{margin-top:14px;border-top:1px solid #eee;padding-top:8px}.ledger-row{display:grid;grid-template-columns:1.2fr .7fr .8fr;gap:10px;padding:11px 0;border-bottom:1px solid #eee;align-items:center}.positive{color:#17632b}.due{color:#9b1c1c}.settled{color:#17632b}.pill{display:inline-block;border-radius:999px;padding:5px 8px;font-size:12px;font-weight:900;background:#eee}.pill.due{background:#ffe8e8}.pill.settled{background:#e8f6ec}.paybox{margin-top:14px;padding:14px;border-radius:16px;background:#f7f7f7}.paygrid{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}.empty{text-align:center;padding:30px;color:#777}#login{max-width:440px;margin:70px auto}#msg{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#111;color:#fff;border-radius:999px;padding:10px 15px;display:none;z-index:20;max-width:92%}@media(max-width:820px){.metric-grid{grid-template-columns:1fr 1fr}.ledger-row{grid-template-columns:1fr}.paygrid{grid-template-columns:1fr}.shell{padding:14px}.driver-card>.row{align-items:flex-start}.driver-card>.row>div:last-child{text-align:left!important}.brand{font-size:24px}}@media(max-width:430px){.metric-grid{grid-template-columns:1fr}.shell{padding:10px}.card,.driver-card{padding:14px}.row{align-items:flex-start}.row>div{min-width:0}.row button{min-height:44px}.balance{font-size:23px}.driver-card .row{gap:8px}.driver-card .row>div:last-child{width:100%}}
</style>
</head>
<body>
<div id="msg"></div>
<div id="login" class="card"><div class="brand">Sahreej Settlements</div><p class="muted">Admin access only.</p><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button class="primary" style="width:100%;margin-top:14px" onclick="login()">Sign in</button><p id="loginError" class="muted"></p></div>
<div id="app" class="shell hidden">
  <div class="row" style="margin-bottom:18px"><div><div class="brand">Driver settlements</div><div class="muted">Cash commission reconciliation</div></div><div><button class="secondary" onclick="loadSettlements()">Refresh</button> <button class="secondary" onclick="logout()">Sign out</button></div></div>
  <div id="summary" class="metric-grid"></div>
  <div id="list"></div>
</div>
<script>
const SUPABASE_URL='https://neohwquxzrbqheaierpp.supabase.co';
const SUPABASE_KEY='sb_publishable_xm3a8wuolDwomUgNk9W1mg_s11ow-k5';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'sahreej-admin-auth-v1'}});
const q=id=>document.getElementById(id);const money=n=>'$'+Number(n||0).toFixed(2);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){const m=q('msg');m.textContent=s;m.style.display='block';setTimeout(()=>m.style.display='none',3200)}
async function rpc(name,args={}){const r=await sb.rpc(name,args);if(r.error)throw r.error;return r.data}
async function guard(){const {data:{session}}=await sb.auth.getSession();if(!session)return false;try{return await rpc('is_admin')===true}catch(_){return false}}
async function login(){q('loginError').textContent='';const {error}=await sb.auth.signInWithPassword({email:q('email').value.trim(),password:q('password').value});if(error){q('loginError').textContent=error.message;return}if(!(await guard())){q('loginError').textContent='Admin access required';await sb.auth.signOut();return}start()}
async function logout(){await sb.auth.signOut();location.reload()}
async function start(){q('login').classList.add('hidden');q('app').classList.remove('hidden');await loadSettlements()}
function ledgerLabel(t){return ({order_earning:'Delivery earning',platform_fee_due:'Commission due',payment:'Payment received',adjustment_credit:'Admin credit',adjustment_debit:'Admin debit'})[t]||String(t||'').replaceAll('_',' ')}
function ledgerAmountClass(t){return ['payment','adjustment_credit'].includes(t)?'positive':['platform_fee_due','adjustment_debit'].includes(t)?'due':''}
async function openLedger(driverId){const box=q('ledger-'+driverId);if(!box)return;if(!box.classList.contains('hidden')){box.classList.add('hidden');box.innerHTML='';return}box.classList.remove('hidden');box.innerHTML='<div class="muted">Loading settlement history…</div>';try{const rows=await rpc('admin_get_driver_ledger',{p_driver_id:driverId,p_limit:200});box.innerHTML='<div class="ledger">'+((rows||[]).map(x=>`<div class="ledger-row"><div><strong>${esc(ledgerLabel(x.type))}</strong><div class="muted tiny">${esc(x.note||'')}</div>${x.order_id?`<div class="tiny" style="font-family:monospace">${esc(x.order_id)}</div>`:''}</div><div class="${ledgerAmountClass(x.type)}"><strong>${money(x.amount_usd)}</strong></div><div class="muted tiny">${new Date(x.created_at).toLocaleString()}</div></div>`).join('')||'<div class="empty">No settlement activity.</div>')+'</div>'}catch(e){box.innerHTML='<div class="muted">'+esc(e.message)+'</div>'}}
async function recordPayment(driverId,due){const amount=Number(q('pay-'+driverId)?.value||0);const note=String(q('note-'+driverId)?.value||'').trim();if(!Number.isFinite(amount)||amount<=0){toast('Enter a payment amount');return}if(amount>Number(due)+0.005){toast('Payment cannot exceed the outstanding balance');return}if(!confirm(`Record ${money(amount)} received from this driver?`))return;try{await rpc('admin_record_driver_payment',{p_driver_id:driverId,p_amount_usd:amount,p_note:note||null});toast('Payment recorded');await loadSettlements()}catch(e){toast(e.message)}}
async function adjust(driverId,credit){const raw=prompt(credit?'Credit amount:':'Debit amount:');if(raw===null)return;const amount=Number(raw);if(!Number.isFinite(amount)||amount<=0){toast('Enter a valid amount');return}const note=prompt('Reason for this adjustment:');if(note===null||note.trim().length<3){toast('Adjustment note is required');return}try{await rpc('admin_adjust_driver_balance',{p_driver_id:driverId,p_amount_usd:amount,p_credit:credit,p_note:note.trim()});toast(credit?'Credit added':'Debit added');await loadSettlements()}catch(e){toast(e.message)}}
async function loadSettlements(){const host=q('list');host.innerHTML='<div class="card muted">Loading balances…</div>';try{const rows=await rpc('admin_list_driver_balances');const totalDue=(rows||[]).reduce((s,x)=>s+Number(x.outstanding_balance??x.amount_due_to_sahreej||0),0);const totalFees=(rows||[]).reduce((s,x)=>s+Number(x.platform_fees_due||0),0);const totalPaid=(rows||[]).reduce((s,x)=>s+Number(x.payments_to_sahreej||0),0);const totalEarnings=(rows||[]).reduce((s,x)=>s+Number(x.total_earnings||0),0);q('summary').innerHTML=`<div class="metric"><small>Outstanding</small><strong>${money(totalDue)}</strong></div><div class="metric"><small>Commission generated</small><strong>${money(totalFees)}</strong></div><div class="metric"><small>Payments received</small><strong>${money(totalPaid)}</strong></div><div class="metric"><small>Driver earnings</small><strong>${money(totalEarnings)}</strong></div>`;host.innerHTML=(rows||[]).map(x=>{const id=x.driver_id,due=Number(x.outstanding_balance??x.amount_due_to_sahreej||0);return `<div class="driver-card"><div class="row"><div><strong style="font-size:19px">${esc(x.driver_name||x.full_name||'Driver')}</strong><div class="muted">${esc(x.phone||'')} ${x.vehicle_plate?'· '+esc(x.vehicle_plate):''}</div></div><div style="text-align:right"><div class="balance ${due>0?'due':'settled'}">${money(due)}</div><span class="pill ${due>0?'due':'settled'}">${due>0?'DUE TO SAHREEJ':'SETTLED'}</span></div></div><div class="metric-grid"><div class="metric"><small>Driver earnings</small><strong>${money(x.total_earnings)}</strong></div><div class="metric"><small>Commission due</small><strong>${money(x.platform_fees_due)}</strong></div><div class="metric"><small>Paid</small><strong>${money(x.payments_to_sahreej)}</strong></div><div class="metric"><small>Outstanding</small><strong>${money(due)}</strong></div></div><div class="row"><button class="secondary" onclick="openLedger('${id}')">View settlement history</button><div><button class="secondary" onclick="adjust('${id}',true)">Add credit</button> <button class="secondary" onclick="adjust('${id}',false)">Add debit</button></div></div>${due>0?`<div class="paybox"><strong>Record payment received</strong><div class="paygrid"><div><label>Amount</label><input id="pay-${id}" type="number" min="0.01" step="0.01" max="${due.toFixed(2)}" value="${due.toFixed(2)}"></div><div><label>Note</label><input id="note-${id}" placeholder="Cash received, bank transfer…"></div><button class="primary" onclick="recordPayment('${id}',${due})">Record payment</button></div></div>`:''}<div id="ledger-${id}" class="hidden"></div></div>`}).join('')||'<div class="card empty">No driver balances.</div>'}catch(e){host.innerHTML='<div class="card muted">'+esc(e.message)+'</div>'}}
(async()=>{if(await guard())start()})();
</script>
</body></html>
